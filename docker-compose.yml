# SIMPLE, single-server deployment.
#
#   1. cp .env.example .env     and fill it in
#   2. set POSTGRES_PASSWORD below to the same password you put in DATABASE_URL
#   3. docker compose up -d --build
#
# The application is bound to 127.0.0.1 on purpose. Nginx sits in front of it
# and holds the TLS certificate. See docs/SERVER_SETUP_GUIDE.md, Step 6.

services:
  db:
    # PostgreSQL 17. The database file you have been given was produced by
    # pg_dump 17, so 17 restores it natively. 18 also works, but 18 moved the
    # default data directory, so if you raise this you must check that the
    # volume below still points at PGDATA. Do not go below 17.
    image: postgres:17
    restart: always
    environment:
      POSTGRES_DB: simple
      POSTGRES_USER: simple
      POSTGRES_PASSWORD: CHANGE_ME
      # Set explicitly so the volume mount cannot drift from where the image
      # actually keeps its data.
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U simple -d simple"]
      interval: 10s
      timeout: 5s
      retries: 10

  web:
    build: .
    restart: always
    env_file: .env
    environment:
      PORT: "8080"
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - media:/app/mediafiles

volumes:
  pgdata:
  media:
